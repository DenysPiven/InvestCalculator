name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  # Keep the bundled price cache fresh on Pages (only new days are downloaded).
  schedule:
    - cron: '30 6 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: npm ci
      - name: Refresh price cache (incremental)
        run: |
          pip install -q yfinance pandas
          python3 scripts/update_prices_cache.py --incremental
        continue-on-error: true
      - name: Build
        env:
          # Repo is https://github.com/DenysPiven/InvestCalculator
          VITE_BASE: /InvestCalculator/
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
